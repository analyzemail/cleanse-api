<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Analyzemail API Reference</title>
    <meta name="description" content="Verify single addresses in real time, cleanse whole email lists and download per-address results with the Analyzemail REST API." />
    <meta property="og:title" content="Analyzemail API Reference" />
    <meta property="og:description" content="Real-time email verification, list cleansing and results." />
    <meta property="og:image" content="https://documentation.analyzemail.com/assets/social-card.png" />
    <meta name="theme-color" content="#2d2735" />
    <link rel="icon" href="assets/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --am-ink: #2d2735;
        --am-ink-2: #241f2b;
        --am-ink-3: #37303f;
        --am-line: #463d50;
        --am-text: #f4f1f7;
        --am-text-2: #bdb4c7;
        --am-text-3: #8d8398;
        --am-mint: #2fffa6;
        --am-magenta: #cb02e0;
        --am-purple: #6307a1;
        --am-bar-h: 56px;
      }

      html, body {
        margin: 0;
        background: var(--am-ink);
        color: var(--am-text);
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      }

      .am-bar {
        position: sticky;
        top: 0;
        z-index: 100;
        height: var(--am-bar-h);
        display: flex;
        align-items: center;
        gap: 24px;
        padding: 0 20px;
        background: var(--am-ink-2);
        border-bottom: 1px solid var(--am-line);
      }

      .am-bar::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        bottom: -1px;
        height: 2px;
        background: linear-gradient(90deg, var(--am-purple), var(--am-magenta) 40%, var(--am-mint));
      }

      .am-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        color: inherit;
        text-decoration: none;
      }

      .am-brand img {
        height: 22px;
        width: auto;
        display: block;
      }

      .am-brand span {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--am-text-3);
        padding-left: 12px;
        border-left: 1px solid var(--am-line);
      }

      .am-links {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 20px;
        font-size: 14px;
        font-weight: 500;
      }

      .am-links a {
        color: var(--am-text-2);
        text-decoration: none;
      }

      .am-links a:hover {
        color: var(--am-text);
      }

      .am-links a.am-cta {
        color: var(--am-ink);
        background: var(--am-mint);
        padding: 7px 14px;
        border-radius: 8px;
        font-weight: 600;
      }

      .am-links a.am-cta:hover {
        color: var(--am-ink);
        filter: brightness(1.08);
      }

      @media (max-width: 720px) {
        .am-brand span,
        .am-links a:not(.am-cta) {
          display: none;
        }
      }

      /* Scalar theme overrides */
      .dark-mode {
        --scalar-background-1: var(--am-ink);
        --scalar-background-2: var(--am-ink-3);
        --scalar-background-3: #41394a;
        --scalar-background-accent: rgba(47, 255, 166, 0.1);
        --scalar-border-color: var(--am-line);
        --scalar-color-1: var(--am-text);
        --scalar-color-2: var(--am-text-2);
        --scalar-color-3: var(--am-text-3);
        --scalar-color-accent: var(--am-mint);
        --scalar-color-green: var(--am-mint);
        --scalar-color-purple: #c77dff;
        --scalar-button-1: var(--am-mint);
        --scalar-button-1-color: var(--am-ink);
        --scalar-button-1-hover: #5dffbb;
        --scalar-sidebar-background-1: var(--am-ink-2);
        --scalar-sidebar-color-1: var(--am-text);
        --scalar-sidebar-color-2: var(--am-text-2);
        --scalar-sidebar-color-active: var(--am-mint);
        --scalar-sidebar-item-active-background: rgba(47, 255, 166, 0.1);
        --scalar-sidebar-border-color: var(--am-line);
        --scalar-sidebar-search-background: var(--am-ink-3);
        --scalar-sidebar-search-border-color: var(--am-line);
      }

      :root {
        --scalar-font: 'Plus Jakarta Sans', system-ui, sans-serif;
        --scalar-font-code: 'JetBrains Mono', ui-monospace, monospace;
        --scalar-custom-header-height: var(--am-bar-h);
      }
    </style>
  </head>
  <body>
    <header class="am-bar">
      <a class="am-brand" href="./">
        <img src="assets/logo-on-dark.png" alt="Analyzemail" width="95" height="22" />
        <span>API Reference</span>
      </a>
      <nav class="am-links">
        <a href="https://github.com/analyzemail/cleanse-api">GitHub</a>
        <a href="openapi.yaml">OpenAPI spec</a>
        <a class="am-cta" href="https://analyzemail.com/account/settings/api">Get an API key</a>
      </nav>
    </header>

    <div id="app"></div>

    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.72.1/dist/browser/standalone.js"></script>
    <script>
      Scalar.createApiReference('#app', {
        url: './openapi.json',
        theme: 'none',
        forceDarkModeState: 'dark',
        hideDarkModeToggle: true,
        withDefaultFonts: false,
        showDeveloperTools: 'never',
        agent: { disabled: true },
        mcp: { disabled: true },
        defaultHttpClient: { targetKey: 'shell', clientKey: 'curl' },
        metaData: { title: 'Analyzemail API Reference' },
      });
    </script>
  </body>
